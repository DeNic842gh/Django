services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: pirate_restaurant
      POSTGRES_USER: pirate
      POSTGRES_PASSWORD: treasure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pirate_restaurant
      - POSTGRES_USER=pirate
      - POSTGRES_PASSWORD=treasure
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgresql://pirate:treasure@db:5432/pirate_restaurant

volumes:
  postgres_data: