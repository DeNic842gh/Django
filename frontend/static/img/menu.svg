<svg width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="menuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#deb887;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#8b4513" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="800" height="1200" fill="url(#menuGrad)" rx="20" ry="20"/>

  <!-- Заголовок -->
  <text x="400" y="80" font-family="serif" font-size="36" fill="#8b4513" text-anchor="middle" font-weight="bold" filter="url(#shadow)">
    🏴‍☠️ Меню ресторану
  </text>
  <text x="400" y="110" font-family="serif" font-size="24" fill="#daa520" text-anchor="middle">
    «Чорна Вітрильна»
  </text>

  <!-- Декоративні елементи -->
  <circle cx="100" cy="100" r="30" fill="#daa520" opacity="0.2"/>
  <circle cx="700" cy="100" r="25" fill="#daa520" opacity="0.3"/>
  <circle cx="100" cy="1100" r="35" fill="#daa520" opacity="0.25"/>
  <circle cx="700" cy="1100" r="20" fill="#daa520" opacity="0.35"/>

  <!-- Лінія розділення -->
  <line x1="50" y1="140" x2="750" y2="140" stroke="#8b4513" stroke-width="2" opacity="0.5"/>

  <!-- Категорії меню -->
  <text x="400" y="180" font-family="serif" font-size="28" fill="#8b4513" text-anchor="middle" font-weight="bold">
    Закуски
  </text>

  <!-- Страви -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="700" height="80" fill="rgba(255,255,255,0.7)" rx="10" ry="10" stroke="#deb887" stroke-width="1"/>
    <text x="20" y="25" font-family="sans-serif" font-size="18" fill="#2c1810" font-weight="bold">Піратава паста «Чорна перлина»</text>
    <text x="20" y="50" font-family="sans-serif" font-size="14" fill="#5a4a3a">Морський бульйон, кальмари, креветки та часниковий соус</text>
    <text x="650" y="35" font-family="sans-serif" font-size="20" fill="#daa520" font-weight="bold" text-anchor="end">389 ₴</text>
    <text x="650" y="55" font-family="sans-serif" font-size="12" fill="#daa520" text-anchor="end">⭐ Фірмова</text>
  </g>

  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="700" height="60" fill="rgba(255,255,255,0.7)" rx="10" ry="10" stroke="#deb887" stroke-width="1"/>
    <text x="20" y="20" font-family="sans-serif" font-size="16" fill="#2c1810" font-weight="bold">Гарячий рифовий нашас</text>
    <text x="20" y="40" font-family="sans-serif" font-size="12" fill="#5a4a3a">Яловичина на грилі, ананас, пряні соуси</text>
    <text x="650" y="30" font-family="sans-serif" font-size="18" fill="#daa520" font-weight="bold" text-anchor="end">249 ₴</text>
  </g>

  <text x="400" y="420" font-family="serif" font-size="28" fill="#8b4513" text-anchor="middle" font-weight="bold">
    Морські страви
  </text>

  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="700" height="60" fill="rgba(255,255,255,0.7)" rx="10" ry="10" stroke="#deb887" stroke-width="1"/>
    <text x="20" y="20" font-family="sans-serif" font-size="16" fill="#2c1810" font-weight="bold">Креветки в кокосовому соусі</text>
    <text x="20" y="40" font-family="sans-serif" font-size="12" fill="#5a4a3a">Свіжі креветки в ароматному кокосовому соусі</text>
    <text x="650" y="30" font-family="sans-serif" font-size="18" fill="#daa520" font-weight="bold" text-anchor="end">299 ₴</text>
  </g>

  <text x="400" y="570" font-family="serif" font-size="28" fill="#8b4513" text-anchor="middle" font-weight="bold">
    Основні страви
  </text>

  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="700" height="60" fill="rgba(255,255,255,0.7)" rx="10" ry="10" stroke="#deb887" stroke-width="1"/>
    <text x="20" y="20" font-family="sans-serif" font-size="16" fill="#2c1810" font-weight="bold">Піратський стейк</text>
    <text x="20" y="40" font-family="sans-serif" font-size="12" fill="#5a4a3a">Соковитий стейк з травами та спеціями</text>
    <text x="650" y="30" font-family="sans-serif" font-size="18" fill="#daa520" font-weight="bold" text-anchor="end">450 ₴</text>
  </g>

  <text x="400" y="720" font-family="serif" font-size="28" fill="#8b4513" text-anchor="middle" font-weight="bold">
    Напої
  </text>

  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="700" height="60" fill="rgba(255,255,255,0.7)" rx="10" ry="10" stroke="#deb887" stroke-width="1"/>
    <text x="20" y="20" font-family="sans-serif" font-size="16" fill="#2c1810" font-weight="bold">Ром «Чорна Вітрильна»</text>
    <text x="20" y="40" font-family="sans-serif" font-size="12" fill="#5a4a3a">Класичний ром з Карибського басейну</text>
    <text x="650" y="30" font-family="sans-serif" font-size="18" fill="#daa520" font-weight="bold" text-anchor="end">180 ₴</text>
  </g>

  <text x="400" y="870" font-family="serif" font-size="28" fill="#8b4513" text-anchor="middle" font-weight="bold">
    Десерти
  </text>

  <g transform="translate(50, 900)">
    <rect x="0" y="0" width="700" height="60" fill="rgba(255,255,255,0.7)" rx="10" ry="10" stroke="#deb887" stroke-width="1"/>
    <text x="20" y="20" font-family="sans-serif" font-size="16" fill="#2c1810" font-weight="bold">Золота карамельна стружка</text>
    <text x="20" y="40" font-family="sans-serif" font-size="12" fill="#5a4a3a">Тропічний десерт з кокосом, манго та карамельним сиропом</text>
    <text x="650" y="30" font-family="sans-serif" font-size="18" fill="#daa520" font-weight="bold" text-anchor="end">159 ₴</text>
  </g>

  <!-- Нижній декор -->
  <text x="400" y="1080" font-family="serif" font-size="16" fill="#8b4513" text-anchor="middle" font-style="italic">
    «Де морські легенди зустрічаються зі смаком»
  </text>
  <text x="400" y="1100" font-family="serif" font-size="12" fill="#daa520" text-anchor="middle">
    © 2026 Ресторан «Чорна Вітрильна»
  </text>
</svg>